# Builds the installers from source on every version tag (or by hand) and keeps them as artifacts.
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        shell: pwsh
        run: ./installer/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: dist/*.exe
          if-no-files-found: error
